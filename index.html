<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Juego de mapa</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="totem" id="totem">
  <div id="reinicio-oculto" aria-hidden="true"></div>

  <section class="pantalla" id="inicio">
    <h1 class="titulo" id="titulo"></h1>
    <p class="bajada" id="bajada"></p>
    <button class="boton pulso" id="jugar" type="button"></button>
  </section>

  <section class="pantalla" id="juego" hidden>
    <header class="cabecera">
      <div class="barra" id="barra"></div>
      <div class="cuenta"><span id="cuenta"></span><small id="ayuda"></small></div>
      <p class="consigna" id="consigna"></p>
    </header>
    <div class="zona-mapa">
      <svg id="mapa" aria-label="Mapa de las regiones"></svg>
      <ol class="leyenda" id="leyenda"></ol>
    </div>
    <div class="tarjeta" id="tarjeta"></div>
    <div class="bandeja" id="bandeja"></div>
  </section>

  <section class="pantalla" id="final" hidden>
    <div class="papelitos" id="papelitos"></div>
    <h2 id="final-titulo"></h2>
    <p id="final-texto"></p>
    <button class="boton" id="otra-vez" type="button"></button>
  </section>
</div>

<script src="js/config.js"></script>
<script src="js/juego.js"></script>
</body>
</html>
