<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="color-scheme" content="only light">
<title>Juego de mapa</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="totem" id="totem">
  <button class="atras" id="atras" type="button" aria-label="Volver atrás"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div id="cierre-oculto" aria-hidden="true"></div>

  <div class="deco" aria-hidden="true">
    <img class="nubes nubes-arriba" src="assets/juego/decoracion/nubes.svg" alt="">
    <img class="nubes nubes-abajo" src="assets/juego/decoracion/nubes.svg" alt="">
    <img class="flor mutisia" src="assets/juego/decoracion/mutisia.webp" alt="">
    <img class="flor amancay" src="assets/juego/decoracion/amancay.webp" alt="">
    <img class="flor jarilla" src="assets/juego/decoracion/jarilla.webp" alt="">
  </div>

  <section class="pantalla centrada" id="inicio">
    <img class="logo" src="assets/juego/logo-provincia.svg" alt="Provincia del Neuquén">
    <h2 class="subtitulo" id="inicio-titulo"></h2>
    <h1 class="titulo" id="inicio-texto"></h1>
  </section>

  <section class="pantalla" id="muestra" hidden>
    <header class="cabecera">
      <img class="logo logo-muestra" src="assets/juego/logo-todo-esto-es-nqn.svg" alt="Todo esto es Neuquén">
      <h2 class="subtitulo" id="muestra-titulo"></h2>
      <div class="tiempo"><i id="tiempo-muestra"></i></div>
    </header>
    <div class="muestra" id="muestra-contenido"></div>
    <p class="ayuda" id="muestra-ayuda"></p>
  </section>

  <section class="pantalla centrada" id="condiciones" hidden>
    <img class="logo" src="assets/juego/logo-provincia.svg" alt="Provincia del Neuquén">
    <h2 class="subtitulo" id="condiciones-titulo"></h2>
    <h1 class="titulo" id="condiciones-texto"></h1>
    <button class="boton pulso" id="empezar" type="button"></button>
  </section>

  <section class="pantalla" id="juego" hidden>
    <img class="logo logo-juego" src="assets/juego/logo-provincia.svg" alt="Provincia del Neuquén">
    <div class="estado">
      <span class="cuenta" id="cuenta"></span>
      <div class="intentos" id="intentos"></div>
    </div>
    <div class="tablero">
      <svg id="mapa" class="mapa" aria-label="Mapa de las regiones"></svg>
      <div class="bandeja" id="bandeja"></div>
      <div class="pie-lateral">
        <ol class="leyenda" id="leyenda"></ol>
        <button class="boton boton-chico" id="volver-juego" type="button"></button>
      </div>
      <div class="tarjeta" id="tarjeta" hidden></div>
    </div>
  </section>

  <section class="pantalla centrada" id="final" hidden>
    <div class="papelitos" id="papelitos"></div>
    <img class="logo" src="assets/juego/logo-provincia.svg" alt="Provincia del Neuquén">
    <p class="resultado" id="final-resultado"></p>
    <h2 class="subtitulo" id="final-titulo"></h2>
    <h1 class="titulo" id="final-texto"></h1>
    <button class="boton" id="volver-final" type="button"></button>
  </section>
</div>

<script src="js/config.js"></script>
<script src="js/juego.js"></script>
</body>
</html>
